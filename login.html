<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Mbarara University Portal</title>

  <!-- Icons & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="wrapper">
    <!-- Brand Header -->
    <header class="brand-header">
      <div class="logo-badge">
        <img 
          src="https://applications.must.ac.ug/dist/img/campus_logo.png" 
          alt="MUST Badge"
        />
      </div>
      <h1 class="brand-title">Mbarara University of<br>Science and Technology</h1>
      <span class="portal-pill">Online Application Portal</span>
    </header>

    <!-- Login Card -->
    <section class="card">
      <h2>Welcome Back</h2>
      <p class="subtext">Log in to access your application dashboard</p>

      <form method="POST" action="/login">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <div class="input-box">
            <i class="fa-regular fa-envelope icon" aria-hidden="true"></i>
            <input type="email" id="login-email" name="email" placeholder="name@example.com" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-box">
            <i class="fa-solid fa-lock icon" aria-hidden="true"></i>
            <input type="password" id="login-password" name="password" placeholder="Enter password" required autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
      </form>

      <a href="#" class="forgot-link">
        <i class="fa-solid fa-key"></i> Forgot your password?
      </a>

      <div class="divider">
        <span>New to the portal?</span>
      </div>

      <div class="bottom-actions">
        <!-- Links to register.html -->
        <a href="register.html" class="btn btn-outline create">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </a>
        <a href="https://applications.must.ac.ug/" target="_blank" rel="noopener noreferrer" class="btn btn-outline">
          <i class="fa-regular fa-circle-question"></i> How to Apply
        </a>
      </div>
    </section>
  </main>

</body>
</html>
